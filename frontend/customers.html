<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DokanPro — Customers</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="page-header">
      <h1>Customers</h1>
      <button class="btn btn-primary" onclick="openCustomerModal()">+ New Customer</button>
    </div>

    <input type="text" id="search" class="search-bar" placeholder="Search by name or phone..." />

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Loyalty Points</th>
            <th>Total Spent</th>
            <th>Last Purchase</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="customer-rows"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display:none;">No customers yet.</div>
    </div>
  </div>

  <div id="customer-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3 id="modal-title">New Customer</h3>
      <form id="customer-form">
        <input type="hidden" id="c-id" />
        <label>Name</label>
        <input type="text" id="c-name" required />
        <div class="form-row">
          <div>
            <label>Phone</label>
            <input type="text" id="c-phone" />
          </div>
          <div>
            <label>Email</label>
            <input type="email" id="c-email" />
          </div>
        </div>
        <div id="loyalty-row" style="display:none;">
          <label>Loyalty points</label>
          <input type="number" id="c-loyalty" min="0" />
        </div>
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Save</button>
          <button type="button" class="btn btn-secondary" style="flex:1;" onclick="closeCustomerModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/customers.js"></script>
</body>
</html>
