<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DokanPro — Expenses</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="page-header">
      <h1>Expenses</h1>
      <button class="btn btn-primary" onclick="openExpenseModal()">+ New Expense</button>
    </div>

    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="stat-card">
        <div class="label">Total (filtered period)</div>
        <div class="value" id="stat-total">—</div>
      </div>
      <div>
        <label>From date</label>
        <input type="date" id="filter-from" style="margin:0;" />
      </div>
      <div>
        <label>To date</label>
        <input type="date" id="filter-to" style="margin:0;" />
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr>
        </thead>
        <tbody id="expense-rows"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display:none;">No expenses recorded for this period.</div>
    </div>
  </div>

  <div id="expense-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3>New Expense</h3>
      <form id="expense-form">
        <label>Category</label>
        <input type="text" id="ex-category" list="category-suggestions" required />
        <datalist id="category-suggestions">
          <option value="Rent"></option>
          <option value="Utilities"></option>
          <option value="Salaries"></option>
          <option value="Supplies"></option>
          <option value="Maintenance"></option>
          <option value="Marketing"></option>
          <option value="Other"></option>
        </datalist>
        <label>Amount</label>
        <input type="number" id="ex-amount" step="0.01" min="0.01" required />
        <label>Date</label>
        <input type="date" id="ex-date" required />
        <label>Description (optional)</label>
        <input type="text" id="ex-description" />
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Save</button>
          <button type="button" class="btn btn-secondary" style="flex:1;" onclick="closeExpenseModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/expenses.js"></script>
</body>
</html>
