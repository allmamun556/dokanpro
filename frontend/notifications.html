<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DokanPro — Notifications</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="page-header">
      <h1>Notifications</h1>
    </div>
    <p style="color:var(--text-muted); font-size:14px; margin-top:-10px;">
      No email/SMS provider is configured yet — this is a log of notifications that would have been sent.
    </p>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Event</th>
            <th>Recipient</th>
            <th>Subject</th>
            <th>Status</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="notification-rows"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display:none;">No notifications logged yet.</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
