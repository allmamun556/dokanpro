<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DokanPro — Online Orders</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="page-header">
      <h1>Online Orders</h1>
    </div>

    <div class="grid grid-4" id="order-board">
      <div class="card">
        <h3>Pending</h3>
        <div id="col-pending"></div>
      </div>
      <div class="card">
        <h3>Preparing</h3>
        <div id="col-preparing"></div>
      </div>
      <div class="card">
        <h3>Ready</h3>
        <div id="col-ready"></div>
      </div>
      <div class="card">
        <h3>Completed</h3>
        <div id="col-completed"></div>
      </div>
    </div>
    <div id="empty-state" class="empty-state" style="display:none;">No online orders yet.</div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/online-orders.js"></script>
</body>
</html>
