<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DokanPro — Orders</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="page-header">
      <h1>Order History</h1>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Order #</th>
            <th>Date</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Payment</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="order-rows"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display:none;">No orders yet.</div>
    </div>
  </div>

  <!-- Order Detail / Refund Modal -->
  <div id="order-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="width:480px;">
      <h3>Order #<span id="od-id"></span></h3>
      <div id="od-customer-row" style="display:none; font-size:13px; color:var(--text-muted); margin-bottom:10px;">Customer: <span id="od-customer"></span></div>
      <div id="od-items" style="margin-bottom:14px;"></div>
      <div class="cart-totals" style="border-top:1px solid #e5e7eb; padding-top:10px;">
        <div class="row"><span>Subtotal</span><span id="od-subtotal"></span></div>
        <div class="row"><span>Tax</span><span id="od-tax"></span></div>
        <div class="row" id="od-discount-row" style="display:none;"><span id="od-discount-label">Discount</span><span id="od-discount"></span></div>
        <div class="row" style="font-weight:700;"><span>Total</span><span id="od-total"></span></div>
        <div class="row"><span>Paid via</span><span id="od-payment"></span></div>
        <div class="row" id="od-reference-row" style="display:none;"><span>Trx ID</span><span id="od-reference"></span></div>
      </div>

      <div id="refund-section" style="margin-top:16px;">
        <label>Return reason</label>
        <input type="text" id="refund-reason" placeholder="e.g. customer changed mind" />
        <label>Quantities to return</label>
        <div id="return-items"></div>
        <button type="button" class="btn btn-secondary btn-sm" style="margin-bottom:10px;" onclick="fillMaxReturnQty()">Return all remaining</button>
        <button class="btn btn-danger btn-block" onclick="submitRefund()">Process Return</button>
      </div>

      <button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="printOrderReceipt()">🖨 Print Receipt</button>
      <button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="downloadOrderInvoice()">⬇ Download Invoice (PDF)</button>
      <button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="closeOrderModal()">Close</button>
    </div>
  </div>

  <div id="print-area"></div>

  <script src="/js/api.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
