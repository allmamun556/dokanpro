<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DokanPro — Purchases</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="page-header">
      <h1>Purchases</h1>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-top:0;">New Purchase</h3>
      <div class="form-row">
        <div>
          <label>Supplier</label>
          <select id="pu-supplier"><option value="">— none —</option></select>
        </div>
        <div>
          <label>Invoice number (optional)</label>
          <input type="text" id="pu-invoice" />
        </div>
      </div>

      <label>Add product</label>
      <input type="text" id="pu-search" class="search-bar" placeholder="Search products by name or SKU..." />
      <div id="pu-search-results" style="margin-bottom:14px;"></div>

      <table>
        <thead>
          <tr><th>Product</th><th>Qty</th><th>Unit Cost</th><th>Line Total</th><th></th></tr>
        </thead>
        <tbody id="pu-cart-rows"></tbody>
      </table>
      <div id="pu-cart-empty" class="empty-state" style="display:none;">No items added yet.</div>

      <div class="cart-totals">
        <div class="row"><span>Subtotal</span><span id="pu-subtotal">$0.00</span></div>
        <div class="row"><span>Tax</span><span id="pu-tax">$0.00</span></div>
        <div class="row">
          <span>Discount</span>
          <input type="number" id="pu-discount" step="0.01" min="0" value="0" style="width:100px; margin:0;" />
        </div>
        <div class="row total-row"><span>Total</span><span id="pu-total">$0.00</span></div>
      </div>

      <button id="pu-save-btn" class="btn btn-primary btn-block" style="margin-top:14px;" disabled onclick="savePurchase()">Save Purchase</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Purchase History</h3>
      <table>
        <thead>
          <tr><th>#</th><th>Date</th><th>Supplier</th><th>Items</th><th>Total</th><th>Paid</th><th>Due</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="history-rows"></tbody>
      </table>
      <div id="history-empty" class="empty-state" style="display:none;">No purchases yet.</div>
    </div>
  </div>

  <div id="purchase-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="width:520px;">
      <h3>Purchase #<span id="pd-id"></span></h3>
      <div id="pd-items" style="margin-bottom:14px;"></div>
      <div class="cart-totals" style="border-top:1px solid #e5e7eb; padding-top:10px;">
        <div class="row"><span>Subtotal</span><span id="pd-subtotal"></span></div>
        <div class="row"><span>Tax</span><span id="pd-tax"></span></div>
        <div class="row" style="font-weight:700;"><span>Total</span><span id="pd-total"></span></div>
        <div class="row"><span>Paid</span><span id="pd-paid"></span></div>
        <div class="row" style="font-weight:700;"><span>Due</span><span id="pd-due"></span></div>
      </div>

      <div id="payment-history" style="margin:14px 0;"></div>

      <div id="payment-section" style="margin-top:16px;">
        <label>Record Payment</label>
        <div class="form-row">
          <div>
            <input type="number" id="pay-amount" step="0.01" min="0.01" placeholder="Amount" />
          </div>
          <div>
            <input type="date" id="pay-date" />
          </div>
        </div>
        <div class="form-row">
          <div>
            <select id="pay-method">
              <option value="cash">Cash</option>
              <option value="card">Card</option>
              <option value="bkash">bKash</option>
              <option value="nagad">Nagad</option>
              <option value="rocket">Rocket</option>
              <option value="other">Other (bank transfer, check, etc.)</option>
            </select>
          </div>
          <div>
            <input type="text" id="pay-note" placeholder="Note (optional)" />
          </div>
        </div>
        <button class="btn btn-success btn-block" onclick="submitPurchasePayment()">Record Payment</button>
      </div>

      <div id="return-section" style="margin-top:16px;">
        <label>Return reason</label>
        <input type="text" id="return-reason" placeholder="e.g. damaged goods" />
        <label>Quantities to return</label>
        <div id="return-items"></div>
        <button class="btn btn-danger btn-block" style="margin-top:8px;" onclick="submitPurchaseReturn()">Process Return</button>
      </div>

      <button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="closePurchaseModal()">Close</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/purchases.js"></script>
</body>
</html>
