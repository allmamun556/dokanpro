<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — Bavaria Genuss Restaurant</title>
  <link rel="stylesheet" href="/site/css/site.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#c2410c" />
  <link rel="apple-touch-icon" href="/site/icons/icon-192.svg" />
</head>
<body>
  <div id="site-nav"></div>

  <div class="site-page">
    <div class="page-header">
      <h1 data-i18n="cart.title">Your Cart</h1>
    </div>

    <div class="card">
      <div id="cart-lines"></div>
      <div id="cart-empty" class="empty-state" style="display:none;"><span data-i18n="cart.empty">Your cart is empty.</span> <a href="menu.html" data-i18n="cart.browseMenu">Browse the menu</a>.</div>

      <div id="coupon-row" style="display:none; margin-top:12px;">
        <div class="form-row" style="align-items:flex-end;">
          <div>
            <label data-i18n="cart.couponCode">Coupon code</label>
            <input type="text" id="coupon-code" placeholder="e.g. WELCOME10" />
          </div>
          <button type="button" class="btn btn-secondary" data-i18n="cart.apply" style="margin-bottom:14px;" onclick="applyCoupon()">Apply</button>
        </div>
        <div id="coupon-feedback" style="font-size:13px; margin-bottom:8px;"></div>
      </div>

      <div id="loyalty-row" style="display:none; margin-top:8px;">
        <label style="display:flex; align-items:center; gap:8px; font-weight:400;">
          <input type="checkbox" id="redeem-points" style="width:auto; margin:0;" onchange="render()" />
          <span id="loyalty-hint"></span>
        </label>
      </div>

      <div class="cart-totals" id="cart-total-row" style="display:none;">
        <div class="row"><span data-i18n="cart.subtotal">Subtotal</span><span id="cart-subtotal"></span></div>
        <div class="row" id="coupon-discount-row" style="display:none;"><span data-i18n="cart.couponCode">Coupon</span><span id="coupon-discount"></span></div>
        <div class="row" id="loyalty-discount-row" style="display:none;"><span>Loyalty points</span><span id="loyalty-discount"></span></div>
        <div class="row total-row"><span data-i18n="cart.total">Total</span><span id="cart-total"></span></div>
      </div>
    </div>

    <div class="card" id="checkout-form-card" style="margin-top:20px;">
      <h3 id="checkout-form-title" data-i18n="cart.deliveryDetails">Delivery Details</h3>

      <div id="dine-in-banner" class="badge badge-ok" style="display:none; margin-bottom:14px;"></div>

      <form id="checkout-form">
        <div id="order-type-row">
          <label data-i18n="cart.orderType">Order type</label>
          <div class="tabs">
            <div class="tab active" data-type="pickup" data-i18n="cart.pickup" onclick="setFulfillmentType('pickup')">Pickup</div>
            <div class="tab" data-type="delivery" data-i18n="cart.delivery" onclick="setFulfillmentType('delivery')">Delivery</div>
          </div>
        </div>

        <div id="guest-fields">
          <div class="form-row">
            <div>
              <label data-i18n="cart.name">Name</label>
              <input type="text" id="guest-name" />
            </div>
            <div>
              <label data-i18n="cart.phone">Phone</label>
              <input type="text" id="guest-phone" />
            </div>
          </div>
          <label>Email</label>
          <input type="email" id="guest-email" />
        </div>

        <div id="delivery-address-row" style="display:none;">
          <label data-i18n="cart.deliveryAddress">Delivery Address</label>
          <input type="text" id="delivery-address" placeholder="Street, house number, postal code, city" />
        </div>

        <button type="submit" class="btn btn-accent btn-block" data-i18n="cart.proceedToPayment" style="margin-top:16px;">Proceed to Payment</button>
      </form>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="/site/js/translations.js"></script>
  <script src="/site/js/site-api.js"></script>
  <script src="/site/js/cart.js"></script>
</body>
</html>
