<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserve a Table — Bavaria Genuss Restaurant</title>
  <link rel="stylesheet" href="/site/css/site.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#c2410c" />
  <link rel="apple-touch-icon" href="/site/icons/icon-192.svg" />
</head>
<body>
  <div id="site-nav"></div>

  <div class="site-page">
    <div class="page-header">
      <h1 data-i18n="reservations.title">Reserve a Table</h1>
    </div>

    <div class="card">
      <form id="reservation-form">
        <div class="form-row">
          <div>
            <label data-i18n="reservations.dateTime">Date &amp; Time</label>
            <input type="datetime-local" id="r-time" required />
          </div>
          <div>
            <label data-i18n="reservations.partySize">Party Size</label>
            <input type="number" id="r-party" min="1" value="2" required />
          </div>
        </div>

        <div id="guest-fields">
          <div class="form-row">
            <div>
              <label data-i18n="cart.name">Name</label>
              <input type="text" id="r-name" />
            </div>
            <div>
              <label data-i18n="cart.phone">Phone</label>
              <input type="text" id="r-phone" />
            </div>
          </div>
          <label>Email</label>
          <input type="email" id="r-email" />
        </div>

        <label data-i18n="reservations.specialRequests">Special Requests</label>
        <textarea id="r-notes" rows="3" placeholder="Window seat, allergies, birthday, etc."></textarea>

        <button type="submit" class="btn btn-accent btn-block" data-i18n="reservations.submit" style="margin-top:16px;">Request Reservation</button>
      </form>
    </div>

    <div class="card" id="confirmation" style="display:none; margin-top:20px;"></div>
  </div>

  <div id="site-footer"></div>

  <script src="/site/js/translations.js"></script>
  <script src="/site/js/site-api.js"></script>
  <script src="/site/js/reservations.js"></script>
</body>
</html>
