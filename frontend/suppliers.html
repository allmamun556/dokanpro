<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DokanPro — Suppliers</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="page-header">
      <h1>Suppliers</h1>
      <button class="btn btn-primary" onclick="openSupplierModal()">+ New Supplier</button>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th>Due Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="supplier-rows"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display:none;">No suppliers yet.</div>
    </div>
  </div>

  <div id="supplier-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3 id="modal-title">New Supplier</h3>
      <form id="supplier-form">
        <input type="hidden" id="s-id" />
        <label>Name</label>
        <input type="text" id="s-name" required />
        <div class="form-row">
          <div>
            <label>Phone</label>
            <input type="text" id="s-phone" />
          </div>
          <div>
            <label>Email</label>
            <input type="email" id="s-email" />
          </div>
        </div>
        <label>Address</label>
        <input type="text" id="s-address" />
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Save</button>
          <button type="button" class="btn btn-secondary" style="flex:1;" onclick="closeSupplierModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/suppliers.js"></script>
</body>
</html>
