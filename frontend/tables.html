<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DokanPro — Tables</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="page-header">
      <h1>Tables</h1>
      <button class="btn btn-primary" onclick="openNewTableModal()">+ New Table</button>
    </div>

    <div class="grid grid-4" id="table-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none;">No tables yet.</div>
  </div>

  <div id="new-table-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3>New Table</h3>
      <form id="new-table-form">
        <label>Label</label>
        <input type="text" id="t-label" placeholder="e.g. T6" required />
        <label>Capacity</label>
        <input type="number" id="t-capacity" min="1" value="4" required />
        <div style="display:flex; gap:10px; margin-top:14px;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Create</button>
          <button type="button" class="btn btn-secondary" style="flex:1;" onclick="closeNewTableModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="print-area"></div>

  <script src="/js/api.js"></script>
  <script src="/js/tables.js"></script>
</body>
</html>
