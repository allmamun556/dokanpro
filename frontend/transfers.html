<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DokanPro — Stock Transfers</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="page-header">
      <h1>Stock Transfers</h1>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-top:0;">New Transfer</h3>
      <form id="transfer-form">
        <label>Product</label>
        <select id="tr-product" required></select>
        <div class="form-row">
          <div>
            <label>From store</label>
            <select id="tr-from" required></select>
          </div>
          <div>
            <label>To store</label>
            <select id="tr-to" required></select>
          </div>
        </div>
        <div id="tr-available" style="font-size:12px; color:var(--text-muted); margin:-8px 0 14px;"></div>
        <div class="form-row">
          <div>
            <label>Quantity</label>
            <input type="number" id="tr-qty" min="1" required />
          </div>
          <div>
            <label>Note (optional)</label>
            <input type="text" id="tr-note" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Transfer Stock</button>
      </form>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Transfer History</h3>
      <table>
        <thead>
          <tr><th>Date</th><th>Product</th><th>From</th><th>To</th><th>Qty</th><th>Note</th></tr>
        </thead>
        <tbody id="history-rows"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display:none;">No transfers yet.</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/transfers.js"></script>
</body>
</html>
