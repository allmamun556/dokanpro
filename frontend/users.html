<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DokanPro — Users</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="page-header">
      <h1>Users</h1>
      <button class="btn btn-primary" onclick="openUserModal()">+ New User</button>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Position</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Created</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="user-rows"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display:none;">No users found.</div>
    </div>
  </div>

  <div id="user-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="max-height:85vh; overflow-y:auto;">
      <h3 id="modal-title">New User</h3>
      <form id="user-form">
        <input type="hidden" id="u-id" />
        <label>Name</label>
        <input type="text" id="u-name" required />
        <label>Email</label>
        <input type="email" id="u-email" required />
        <label>Password <span id="password-hint" style="font-weight:400;"></span></label>
        <input type="password" id="u-password" placeholder="Leave blank to keep unchanged" />
        <label>Role</label>
        <select id="u-role">
          <option value="cashier">Cashier</option>
          <option value="waiter">Waiter</option>
          <option value="chef">Chef</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
        <div class="form-row">
          <div>
            <label>Phone</label>
            <input type="text" id="u-phone" />
          </div>
          <div>
            <label>Position / title</label>
            <input type="text" id="u-position" placeholder="e.g. Store Manager" />
          </div>
        </div>
        <div class="form-row">
          <div>
            <label>Hire date</label>
            <input type="date" id="u-hire-date" />
          </div>
          <div>
            <label>Salary (optional)</label>
            <input type="number" id="u-salary" step="0.01" min="0" />
          </div>
        </div>
        <div id="active-row" style="display:none;">
          <label>
            <input type="checkbox" id="u-active" style="width:auto; margin-right:8px;" />
            Account active
          </label>
        </div>
        <div id="permissions-section" style="display:none; margin-top:10px;">
          <label>Access &amp; Permissions</label>
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px; margin-top:-8px;">
            Role picks a starting template. Set any capability below to Allow or Deny to build a custom permission set for this person — everything left on Default follows the role.
          </div>
          <div id="permissions-list"></div>
        </div>
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Save</button>
          <button type="button" class="btn btn-secondary" style="flex:1;" onclick="closeUserModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
